<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Favicon - Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .banner {
            width: 898px;
            height: 298px;
            background: linear-gradient(135deg, #875A7B 0%, #5a3d54 50%, #3d2938 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }
        .content {
            text-align: center;
            color: white;
            z-index: 1;
            position: relative;
        }
        .icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .favicon-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .arrow {
            font-size: 40px;
            opacity: 0.8;
        }
        .company-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 20px;
            opacity: 0.9;
            font-weight: 400;
        }
        .version-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: white;
            backdrop-filter: blur(10px);
        }
        .features {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 30px;
            font-size: 14px;
            opacity: 0.9;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <!-- Banner untuk Odoo Apps (898x298 pixels) -->
    <div class="banner">
        <div class="version-badge">Odoo 17 & 18</div>
        <div class="content">
            <div class="icon-container">
                <div class="favicon-icon">🌐</div>
                <span class="arrow">→</span>
                <div class="company-icon">🏢</div>
            </div>
            <h1>Company Favicon</h1>
            <p class="subtitle">Custom favicon per company - Branding made easy!</p>
        </div>
        <div class="features">
            <div class="feature">✨ Multi-Company</div>
            <div class="feature">🔄 Auto Switch</div>
            <div class="feature">📱 PNG/ICO/SVG/GIF</div>
            <div class="feature">⚡ Instant Update</div>
        </div>
    </div>

    <p style="margin-top: 20px; color: #666; font-size: 14px;">
        ↑ Screenshot this banner (898x298 pixels) and save as <strong>banner.png</strong>
    </p>
</body>
</html>
